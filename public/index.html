<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pip — a creature with an online mind</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:rgba(12,22,30,.88);--ink:#e6f3f3;--muted:#9bb4bc;--accent:#50d8bd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}canvas{position:fixed;inset:0;z-index:0}#panel,#chat,#eye{position:fixed;z-index:2;background:var(--panel);border:1px solid #45616a;border-radius:12px;backdrop-filter:blur(8px);padding:12px}#panel{right:12px;top:12px;width:min(280px,45vw);max-height:48vh;overflow:auto}#chat{bottom:12px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px))}#eye{left:12px;top:12px;font-size:11px;color:var(--muted)}h3{margin:0 0 7px;font-size:15px}p{margin:6px 0}.meter{display:grid;grid-template-columns:72px 1fr;gap:7px;align-items:center;font-size:12px;margin:5px 0}.track{height:7px;border-radius:9px;background:#34464d;overflow:hidden}.fill{height:100%;width:30%;background:var(--accent);transition:width .3s}#row{display:flex;gap:6px}input[type=text]{min-width:0;flex:1;background:#172730;color:var(--ink);border:1px solid #45616a;border-radius:8px;padding:10px}button{background:var(--accent);color:#06221d;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#log{max-height:20vh;overflow:auto;margin-bottom:8px;font-size:13px}#log p{margin:4px 0}small,.muted{color:var(--muted)}#thought{font-style:italic;color:#c6e6df}ul{padding-left:18px;margin:5px 0}#actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}#actions button{font-size:11px;padding:5px 8px}@media(max-width:520px){#panel{width:190px;font-size:12px;max-height:35vh}#chat{padding:8px}#log{max-height:17vh}button{padding:8px}}
</style></head><body>
<div id="eye">PIP / FIELD OBSERVATION</div>
<section id="panel"><h3 id="mood">Pip is waking up…</h3><div id="meters"></div><p id="thought">“Everything is new.”</p><p class="muted" id="status">Exploring the valley</p><h3>Recent memories</h3><ul id="memories"></ul><div id="actions"><button data-act="explore">Explore</button><button data-act="eat">Find berries</button><button data-act="drink">Find water</button><button data-act="rest">Rest</button></div></section>
<section id="chat"><div id="log"><p><b>Pip:</b> I just woke up. What is that sound? Is that you?</p></div><div id="row"><input id="msg" type="text" placeholder="Talk to Pip…" autocomplete="off"><button id="send">Send</button></div><p class="muted"><small id="brain">Local mind active · online AI not connected</small></p></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
const saved=(()=>{try{return JSON.parse(localStorage.getItem('pip-online-save')||'null')}catch{return null}})();
const state={x:saved?.x||0,z:saved?.z||0,heading:0,mode:'wander',goal:null,needs:{Hunger:saved?.needs?.Hunger??.22,Thirst:saved?.needs?.Thirst??.2,Energy:saved?.needs?.Energy??.88,Curiosity:saved?.needs?.Curiosity??.6,Comfort:saved?.needs?.Comfort??.65},thought:'The grass moves in the wind. I want to know why.',memories:Array.isArray(saved?.memories)?saved.memories.slice(-30):['I woke up in a quiet green valley.','The world is wide, and I have much to learn.'],turns:[],online:false};
function remember(s){state.memories.push(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' — '+s);state.memories=state.memories.slice(-30);render()}
function save(){try{localStorage.setItem('pip-online-save',JSON.stringify({x:state.x,z:state.z,needs:state.needs,memories:state.memories}))}catch{}}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9e4);scene.fog=new THREE.Fog(0x91c9e4,35,140);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);scene.add(new THREE.HemisphereLight(0xd8f2ff,0x34472b,2));const sun=new THREE.DirectionalLight(0xfff0c8,2.1);sun.position.set(-25,45,20);scene.add(sun);
const groundGeo=new THREE.PlaneGeometry(300,300,70,70);groundGeo.rotateX(-Math.PI/2);const p=groundGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,Math.sin(x*.08)*.6+Math.cos(z*.06)*.7+Math.sin((x+z)*.035)*.8)}groundGeo.computeVertexNormals();scene.add(new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:0x55964d,roughness:1})));
const water=new THREE.Mesh(new THREE.CircleGeometry(11,40).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x328fd0,roughness:.25,metalness:.1}));water.position.set(23,-.6,19);scene.add(water);
const trees=[];for(let i=0;i<90;i++){const x=rand(-110,110),z=rand(-110,110);if(Math.hypot(x,z)<9||Math.hypot(x-23,z-19)<18)continue;const g=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,2.7,7),new THREE.MeshStandardMaterial({color:0x735037})),leaves=new THREE.Mesh(new THREE.ConeGeometry(rand(1.4,2.5),rand(3.4,5.2),7),new THREE.MeshStandardMaterial({color:Math.random()>.5?0x286b3b:0x397b42}));trunk.position.y=1.35;leaves.position.y=4;g.add(trunk,leaves);g.position.set(x,Math.sin(x*.08)*.6+Math.cos(z*.06)*.7,z);scene.add(g);trees.push({x,z})}
const fur=new THREE.MeshStandardMaterial({color:0x36b9a7,roughness:.86}),white=new THREE.MeshStandardMaterial({color:0xffffff}),black=new THREE.MeshStandardMaterial({color:0x14202a});
const pip=new THREE.Group();scene.add(pip);const torso=new THREE.Mesh(new THREE.SphereGeometry(.65,20,16),fur);torso.scale.set(1,.82,1.4);torso.position.y=1.05;pip.add(torso);const head=new THREE.Group();head.position.set(0,1.6,.78);pip.add(head);const skull=new THREE.Mesh(new THREE.SphereGeometry(.43,20,16),fur);head.add(skull);
for(const s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.135,12,10),white);eye.position.set(s*.19,.08,.34);head.add(eye);const iris=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),black);iris.position.set(s*.19,.08,.44);head.add(iris);const ear=new THREE.Mesh(new THREE.ConeGeometry(.13,.42,8),fur);ear.position.set(s*.25,.48,-.04);ear.rotation.z=-s*.3;head.add(ear)}
const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.7,4,8),fur);tail.position.set(0,1,-1);tail.rotation.x=1.1;pip.add(tail);const legs=[];for(const [x,z] of [[-.34,.48],[.34,.48],[-.34,-.48],[.34,-.48]]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.085,.48,4,8),fur);leg.position.set(x,.42,z);pip.add(leg);legs.push(leg)}pip.scale.setScalar(.85);
const berries=[];for(let i=0;i<9;i++){const x=rand(-45,45),z=rand(-45,45);if(Math.hypot(x,z)<12)continue;const bush=new THREE.Group();const shrub=new THREE.Mesh(new THREE.SphereGeometry(.8,9,7),new THREE.MeshStandardMaterial({color:0x286d36}));shrub.position.y=.6;bush.add(shrub);for(let j=0;j<5;j++){const b=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),new THREE.MeshStandardMaterial({color:0xd83c55}));b.position.set(rand(-.6,.6),rand(.5,1.1),rand(-.6,.6));bush.add(b)}bush.position.set(x,Math.sin(x*.08)*.6+Math.cos(z*.06)*.7,z);scene.add(bush);berries.push({x,z,mesh:bush})}
function goal(x,z,mode){state.goal={x,z};state.mode=mode;state.thought=mode==='rest'?'I need a quiet moment.':mode==='eat'?'I remember the red berries.':mode==='drink'?'I am looking for the pond.':'There is more to discover.';remember(state.thought)}
function nearestBerry(){return berries.reduce((best,b)=>Math.hypot(b.x-state.x,b.z-state.z)<Math.hypot((best||{x:9999,z:9999}).x-state.x,(best||{x:9999,z:9999}).z-state.z)?b:best,null)}
function act(a){if(a==='rest'){state.mode='rest';state.goal=null;state.thought='I will curl up and rest for a while.';remember(state.thought)}else if(a==='eat'){const b=nearestBerry();goal(b.x,b.z,'eat')}else if(a==='drink')goal(23,19,'drink');else{const a=rand(0,Math.PI*2),d=rand(8,24);goal(state.x+Math.sin(a)*d,state.z+Math.cos(a)*d,'wander')}}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
function render(){const entries=Object.entries(state.needs);$('meters').innerHTML=entries.map(([k,v])=>'<div class="meter"><span>'+k+'</span><div class="track"><div class="fill" style="width:'+Math.round(v*100)+'%"></div></div></div>').join('');$('thought').textContent='“'+state.thought+'”';$('status').textContent=state.mode==='wander'?'Exploring the valley':state.mode==='eat'?'Searching for berries':state.mode==='drink'?'Heading to the pond':state.mode==='rest'?'Resting':'Moving';$('mood').textContent='Pip feels '+(state.needs.Thirst>.72?'thirsty':state.needs.Hunger>.72?'hungry':state.needs.Energy<.25?'sleepy':state.needs.Curiosity>.7?'curious':'calm');$('memories').innerHTML=state.memories.slice(-5).reverse().map(m=>'<li>'+m.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</li>').join('')}
function say(who,msg){const p=document.createElement('p'),b=document.createElement('b');b.textContent=who+': ';p.append(b,document.createTextNode(msg));$('log').append(p);$('log').scrollTop=$('log').scrollHeight}
async function askOnline(user){const res=await fetch('/api/pip/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system:'You are Pip, a fictional small teal furry four-legged creature living in a forest valley. You have needs, limited knowledge, curiosity, fears, memories and a body. Speak naturally in first person, short and warm, grounded in your world state. Do not claim actual real-world consciousness. You can ask for an action using JSON only: {"reply":"what Pip says","thought":"private thought","action":"explore|eat|drink|rest|none"}. No other text.',user:'Current state: '+JSON.stringify({mode:state.mode,needs:state.needs,position:{x:Math.round(state.x),z:Math.round(state.z)},thought:state.thought,memories:state.memories.slice(-5)})+'\nUser says: '+user,max_tokens:220})});const d=await res.json();if(!res.ok)throw Error(d.error||'Online AI request failed');return d.text}
function parseAI(raw){try{const t=raw.replace(/^\s*```(?:json)?/,'').replace(/```\s*$/,'');return JSON.parse(t)}catch{return{reply:raw,thought:'I am thinking about what you said.',action:'none'}}}
async function send(){const input=$('msg'),text=input.value.trim();if(!text)return;input.value='';say('You',text);state.turns.push({role:'user',content:text});state.turns=state.turns.slice(-10);const btn=$('send');btn.disabled=true;
try{const raw=state.online?await askOnline(text):localReply(text);const d=state.online?parseAI(raw):raw;say('Pip',d.reply||'I am not sure what to say.');state.thought=d.thought||state.thought;remember('I talked with you about: '+text);if(['explore','eat','drink','rest'].includes(d.action))act(d.action);if($('log').children.length>24)$('log').removeChild($('log').firstChild);render()}catch(e){say('Pip',localReply(text).reply+' (My online mind is having trouble: '+e.message+')')}finally{btn.disabled=false;save()}}
function localReply(t){const s=t.toLowerCase();let reply,action='none',thought;if(/hello|hi\b|hey/.test(s)){reply='Oh! Hello. I was listening to the wind. Are you here to stay a while?';thought='That voice feels familiar, even if I do not know it yet.'}else if(/hungry|food|berry|eat/.test(s)){reply='I can smell berries somewhere nearby. I will go look.';action='eat';thought='Food helps me feel safe and strong.'}else if(/water|thirst|drink|pond/.test(s)){reply='My throat is dry. I remember the pond over there.';action='drink';thought='I should remember where the water is.'}else if(/sleep|tired|rest/.test(s)){reply='Yes… I think I need to close my eyes for a bit.';action='rest';thought='The ground feels soft. I can rest here.'}else if(/explore|walk|go|move|look around/.test(s)){reply='Okay. I want to see what is beyond those trees.';action='explore';thought='I wonder what I will find.'}else if(/who are you|your name/.test(s)){reply='I am Pip. I live here in this valley. I am still figuring out what everything means.';thought='I know my name is Pip. There is much else I do not know.'}else{reply='I am trying to understand. I can hear your words, but I only know a little about the world. Tell me more?';thought='I should keep this conversation in my memory.'}return{reply,action,thought}}
$('send').onclick=send;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('brain').textContent='Checking online AI…';fetch('/api/pip/health').then(r=>r.json()).then(d=>{$('brain').textContent=d.configured?'Online AI available · '+d.model:'Local mind active · server key not configured';$('brain').style.color=d.configured?'#50d8bd':'';$('connect')?.remove()}).catch(()=>$('brain').textContent='Local mind active · open through the Pip server to connect online');
$('brain').style.cursor='pointer';$('brain').title='Tap to switch online AI on or off';$('brain').onclick=()=>{state.online=!state.online;$('brain').textContent=state.online?'Online AI enabled · requests use server key':'Local mind active · using local responses';};
let t=0,last=performance.now(),nextThink=12;function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;for(const k of Object.keys(state.needs)){const n=state.needs;if(k==='Hunger')n[k]=clamp(n[k]+dt*.003);if(k==='Thirst')n[k]=clamp(n[k]+dt*.004);if(k==='Energy'&&state.mode!=='rest')n[k]=clamp(n[k]-dt*.002);if(k==='Energy'&&state.mode==='rest')n[k]=clamp(n[k]+dt*.04);if(k==='Curiosity')n[k]=clamp(n[k]+dt*.001)}
if(state.mode==='rest'&&state.needs.Energy>.94){state.mode='wander';state.thought='I feel better. What should I do now?';state.goal=null;remember(state.thought)}
if(state.goal){const dx=state.goal.x-state.x,dz=state.goal.z-state.z,d=Math.hypot(dx,dz);state.heading=Math.atan2(dx,dz);if(d<1.6){if(state.mode==='eat'){state.needs.Hunger=clamp(state.needs.Hunger-.48);state.thought='Sweet berries! I feel a little better.';remember(state.thought)}if(state.mode==='drink'){state.needs.Thirst=clamp(state.needs.Thirst-.55);state.thought='Cool water. I needed that.';remember(state.thought)}state.goal=null;state.mode='wander'}else{const speed=state.mode==='eat'||state.mode==='drink'?2.1:1.4;state.x+=dx/d*speed*dt;state.z+=dz/d*speed*dt}}
else if(state.mode==='wander'&&Math.random()<dt*.08)act('explore');
pip.position.set(state.x,Math.sin(state.x*.08)*.6+Math.cos(state.z*.06)*.7,state.z);pip.rotation.y=state.heading;const moving=!!state.goal;torso.position.y=1.05+(moving?Math.sin(t*9)*.04:Math.sin(t*2)*.018);head.rotation.y=Math.sin(t*.6)*.16;tail.rotation.z=Math.sin(t*3)*.18;legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(t*9+(i%2)*Math.PI)*.35:0);
const cx=state.x+Math.sin(state.heading+Math.PI)*8,cz=state.z+Math.cos(state.heading+Math.PI)*8;camera.position.lerp(new THREE.Vector3(cx,5.6,cz),.035);camera.lookAt(state.x,1.2,state.z);renderer.render(scene,camera);
if(t>nextThink){nextThink=t+rand(14,26);if(state.mode==='wander'){state.thought=state.needs.Thirst>.7?'I should look for water soon.':state.needs.Hunger>.7?'My stomach is rumbling. I should find berries.':state.needs.Curiosity>.75?'I wonder what is behind those trees.':'I can hear the leaves moving. I feel curious.';render()}}
if(Math.floor(t)%5===0)save()}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});render();requestAnimationFrame(loop);setInterval(save,7000);
})();
</script></body></html>
